<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Wishlist – Big Mart</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  :root {
    --nav: #0f0f1a;
    --accent: #f59e0b;
    --accent2: #f97316;
    --accent-hover: #d97706;
    --purple: #6366f1;
    --purple2: #818cf8;
    --bg: #0f0f1a;
    --card: rgba(255,255,255,0.04);
    --border: rgba(255,255,255,0.10);
    --text: #f1f5f9;
    --muted: #94a3b8;
    --radius: 16px;
    --radius-sm: 10px;
    --transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
  }

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 10% 20%, rgba(99,102,241,0.14) 0%, transparent 60%),
      radial-gradient(ellipse 60% 50% at 85% 75%, rgba(245,158,11,0.10) 0%, transparent 55%),
      radial-gradient(ellipse 50% 40% at 50% 50%, rgba(249,115,22,0.06) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  .orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    pointer-events: none;
    z-index: 0;
    animation: float 9s ease-in-out infinite;
  }
  .orb1 { width: 320px; height: 320px; background: rgba(99,102,241,0.12); top: -100px; left: -80px; animation-delay: 0s; }
  .orb2 { width: 220px; height: 220px; background: rgba(245,158,11,0.10); bottom: 80px; right: -60px; animation-delay: 3.5s; }
  .orb3 { width: 160px; height: 160px; background: rgba(249,115,22,0.08); top: 55%; left: 65%; animation-delay: 6s; }

  @keyframes float {
    0%,100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-28px) scale(1.05); }
  }

  /* NAVBAR */
  .navbar {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(15,15,26,0.85);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    padding: 14px 32px;
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .logo {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    font-weight: 800;
    color: var(--accent);
    letter-spacing: -0.5px;
    text-decoration: none;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .logo span { color: var(--purple2); }

  .navbar nav { margin-left: auto; }
  .navbar nav ul { list-style: none; display: flex; gap: 4px; }
  .navbar nav a {
    text-decoration: none;
    color: var(--muted);
    font-size: 13px;
    font-weight: 500;
    padding: 7px 14px;
    border-radius: 999px;
    border: 1px solid transparent;
    transition: var(--transition);
    white-space: nowrap;
  }
  .navbar nav a:hover {
    color: var(--text);
    border-color: var(--border);
    background: rgba(255,255,255,0.05);
  }
  .navbar nav a.cta {
    color: #1a1a2e;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-color: transparent;
    font-weight: 700;
  }
  .navbar nav a.cta:hover { opacity: 0.88; transform: translateY(-1px); }
  .navbar nav a.active {
    color: var(--accent);
    border-color: rgba(245,158,11,0.3);
    background: rgba(245,158,11,0.06);
  }

  /* PAGE HEADER */
  .page-header {
    position: relative;
    z-index: 1;
    padding: 52px 32px 20px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 16px;
  }

  .page-header-left .page-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(239,68,68,0.10);
    border: 1px solid rgba(239,68,68,0.22);
    border-radius: 999px;
    padding: 4px 14px;
    font-size: 12px;
    font-weight: 600;
    color: #f87171;
    margin-bottom: 12px;
    letter-spacing: 0.3px;
  }
  .page-badge::before {
    content: '♥';
    font-size: 11px;
  }

  .page-header h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(26px, 4vw, 38px);
    font-weight: 800;
    letter-spacing: -1px;
    color: var(--text);
  }

  .page-header .sub {
    font-size: 14px;
    color: var(--muted);
    margin-top: 6px;
  }

  .btn-clear-all {
    padding: 9px 22px;
    background: rgba(239,68,68,0.08);
    border: 1px solid rgba(239,68,68,0.25);
    color: #f87171;
    border-radius: 999px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: var(--transition);
  }
  .btn-clear-all:hover {
    background: rgba(239,68,68,0.15);
    transform: translateY(-1px);
  }

  /* PRODUCT GRID */
  .products {
    position: relative;
    z-index: 1;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 18px;
    padding: 16px 32px 48px;
  }

  /* PRODUCT CARD */
  .product {
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    border-radius: 20px;
    overflow: hidden;
    backdrop-filter: blur(12px);
    transition: var(--transition);
    animation: fadeUp 0.5s ease both;
    display: flex;
    flex-direction: column;
  }
  .product:hover {
    transform: translateY(-6px);
    border-color: rgba(239,68,68,0.3);
    box-shadow: 0 16px 40px rgba(0,0,0,0.35), 0 0 0 1px rgba(239,68,68,0.1);
  }

  .product-img-wrap {
    position: relative;
    overflow: hidden;
    background: rgba(255,255,255,0.03);
  }
  .product img {
    width: 100%;
    height: 190px;
    object-fit: cover;
    display: block;
    transition: transform 0.4s ease;
  }
  .product:hover img { transform: scale(1.06); }

  .product-badge {
    position: absolute;
    top: 10px;
    left: 10px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #1a1a2e;
    font-size: 10px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 999px;
    letter-spacing: 0.4px;
  }

  .product-remove {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: rgba(239,68,68,0.15);
    border: 1px solid rgba(239,68,68,0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 14px;
    transition: var(--transition);
    backdrop-filter: blur(8px);
    padding: 0;
  }
  .product-remove:hover { background: rgba(239,68,68,0.3); transform: scale(1.1); }

  .product-body {
    padding: 16px;
    display: flex;
    flex-direction: column;
    flex: 1;
  }

  .product-category {
    font-size: 10px;
    font-weight: 600;
    color: var(--purple2);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 5px;
  }

  .product-name {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 10px;
    line-height: 1.4;
    flex: 1;
  }

  .product-price-row {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 14px;
  }
  .product-price {
    font-size: 20px;
    font-weight: 800;
    color: var(--accent);
  }
  .product-price-old {
    font-size: 13px;
    color: var(--muted);
    text-decoration: line-through;
  }

  .btn-row {
    display: flex;
    gap: 8px;
  }

  .product .btn-add {
    flex: 1;
    padding: 11px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none;
    border-radius: var(--radius-sm);
    color: #1a1a2e;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: var(--transition);
  }
  .product .btn-add:hover {
    opacity: 0.9;
    transform: translateY(-1px);
    box-shadow: 0 6px 20px rgba(245,158,11,0.3);
  }

  .product .btn-remove {
    padding: 11px 14px;
    background: rgba(239,68,68,0.08);
    border: 1px solid rgba(239,68,68,0.25);
    border-radius: var(--radius-sm);
    color: #f87171;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: var(--transition);
  }
  .product .btn-remove:hover {
    background: rgba(239,68,68,0.18);
    transform: translateY(-1px);
  }

  /* EMPTY STATE */
  .empty-state {
    grid-column: 1 / -1;
    text-align: center;
    padding: 80px 20px;
  }
  .empty-icon {
    font-size: 56px;
    margin-bottom: 16px;
    opacity: 0.6;
  }
  .empty-title {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    font-weight: 800;
    color: var(--text);
    margin-bottom: 8px;
  }
  .empty-sub {
    font-size: 15px;
    color: var(--muted);
    margin-bottom: 24px;
  }
  .btn-shop {
    display: inline-block;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #1a1a2e;
    font-family: 'DM Sans', sans-serif;
    font-weight: 700;
    font-size: 15px;
    padding: 13px 32px;
    border-radius: 999px;
    border: none;
    cursor: pointer;
    text-decoration: none;
    transition: var(--transition);
    box-shadow: 0 4px 24px rgba(245,158,11,0.28);
  }
  .btn-shop:hover { transform: translateY(-3px); box-shadow: 0 8px 32px rgba(245,158,11,0.4); }

  /* TOAST */
  .toast {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: #1e293b;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 22px;
    font-size: 14px;
    color: var(--text);
    z-index: 999;
    backdrop-filter: blur(10px);
    transition: transform 0.4s cubic-bezier(0.4,0,0.2,1);
    white-space: nowrap;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.cart { border-color: rgba(245,158,11,0.4); color: #fcd34d; }
  .toast.removed { border-color: rgba(239,68,68,0.4); color: #fca5a5; }

  /* FOOTER */
  footer {
    position: relative;
    z-index: 10;
    text-align: center;
    padding: 24px 20px;
    font-size: 13px;
    color: var(--muted);
    border-top: 1px solid var(--border);
    background: rgba(15,15,26,0.7);
    backdrop-filter: blur(12px);
  }
  footer strong { color: var(--accent); }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(22px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 768px) {
    .navbar { flex-wrap: wrap; gap: 10px; padding: 12px 16px; }
    .navbar nav { margin-left: 0; }
    .page-header { padding: 36px 16px 16px; }
    .products { padding: 12px 16px 36px; gap: 14px; }
  }
</style>
</head>
<body>

  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>

  <!-- NAVBAR -->
  <header class="navbar">
    <a href="index.html" class="logo">Big <span>Mart</span></a>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="wishlist.html" class="active">♡ Wishlist</a></li>
        <li><a href="cart.html">🛒 Cart (<span id="cart-count">0</span>)</a></li>
        <li><a href="login.html">Login</a></li>
        <li><a href="signup.html" class="cta">Sign Up</a></li>
      </ul>
    </nav>
  </header>

  <!-- PAGE HEADER -->
  <div class="page-header">
    <div class="page-header-left">
      <div class="page-badge">Your Wishlist</div>
      <h1>Saved Items</h1>
      <p class="sub" id="wish-sub">0 items saved</p>
    </div>
    <button class="btn-clear-all" id="clear-btn" onclick="clearAll()" style="display:none;">✕ Clear All</button>
  </div>

  <!-- PRODUCT GRID -->
  <section class="products" id="wishlist-grid"></section>

  <!-- FOOTER -->
  <footer>
    <p><strong>Big Mart</strong> &copy; 2026 — Your Favourite Online Store</p>
  </footer>

  <div class="toast" id="toast"></div>

<script>
  let wishlist = JSON.parse(localStorage.getItem('bb_wishlist') || '[]');
  let cart = JSON.parse(localStorage.getItem('bb_cart') || '[]');

  function saveCart() { localStorage.setItem('bb_cart', JSON.stringify(cart)); }
  function saveWishlist() { localStorage.setItem('bb_wishlist', JSON.stringify(wishlist)); }

  function updateCartCount() {
    const total = cart.reduce((s, i) => s + i.qty, 0);
    document.getElementById('cart-count').textContent = total;
  }

  function showToast(msg, type = 'success') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = `toast ${type} show`;
    setTimeout(() => t.classList.remove('show'), 2800);
  }

  function addToCart(id) {
    const product = wishlist.find(p => p.id === id);
    if (!product) return;
    const existing = cart.find(i => i.id === id);
    if (existing) existing.qty++;
    else cart.push({ ...product, qty: 1 });
    saveCart();
    updateCartCount();
    showToast(`🛒 ${product.name} added to cart!`, 'cart');
  }

  function removeFromWishlist(id) {
    const product = wishlist.find(p => p.id === id);
    wishlist = wishlist.filter(p => p.id !== id);
    saveWishlist();
    showToast(`Removed from wishlist`, 'removed');
    render();
  }

  function clearAll() {
    wishlist = [];
    saveWishlist();
    showToast('Wishlist cleared', 'removed');
    render();
  }

  function render() {
    const grid = document.getElementById('wishlist-grid');
    const sub = document.getElementById('wish-sub');
    const clearBtn = document.getElementById('clear-btn');

    sub.textContent = wishlist.length + ' item' + (wishlist.length !== 1 ? 's' : '') + ' saved';
    clearBtn.style.display = wishlist.length > 0 ? 'inline-block' : 'none';

    if (wishlist.length === 0) {
      grid.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">🤍</div>
          <div class="empty-title">Your wishlist is empty</div>
          <p class="empty-sub">Save items you love and come back to them anytime.</p>
          <a href="index.html" class="btn-shop">Browse Products →</a>
        </div>`;
      return;
    }

    grid.innerHTML = wishlist.map((p, i) => {
      const discount = p.oldPrice ? Math.round((1 - p.price / p.oldPrice) * 100) : 0;
      return `
        <div class="product" style="animation-delay:${i * 0.06}s">
          <div class="product-img-wrap">
            <img src="${p.img}" alt="${p.name}" loading="lazy"/>
            ${p.badge ? `<span class="product-badge">${p.badge}</span>` : ''}
            <button class="product-remove" onclick="removeFromWishlist(${p.id})" title="Remove">✕</button>
          </div>
          <div class="product-body">
            <div class="product-category">${p.category}</div>
            <div class="product-name">${p.name}</div>
            <div class="product-price-row">
              <span class="product-price">₹${p.price.toLocaleString('en-IN')}</span>
              ${p.oldPrice ? `<span class="product-price-old">₹${p.oldPrice.toLocaleString('en-IN')}</span>` : ''}
              ${discount > 0 ? `<span style="font-size:11px;color:#86efac;font-weight:700;">${discount}% off</span>` : ''}
            </div>
            <div class="btn-row">
              <button class="btn-add" onclick="addToCart(${p.id})">Add to Cart</button>
              <button class="btn-remove" onclick="removeFromWishlist(${p.id})">✕</button>
            </div>
          </div>
        </div>`;
    }).join('');
  }

  updateCartCount();
  render();
</script>
</body>
</html>
