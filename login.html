<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Login – Big Mart</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
  :root {
    --nav: #0f0f1a;
    --accent: #f59e0b;
    --accent2: #f97316;
    --purple: #6366f1;
    --purple2: #818cf8;
    --bg: #0f0f1a;
    --card: rgba(255,255,255,0.05);
    --border: rgba(255,255,255,0.10);
    --text: #f1f5f9;
    --muted: #94a3b8;
    --radius: 16px;
    --transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
  }

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
  }

  /* ── ANIMATED BG ── */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 10% 20%, rgba(99,102,241,0.18) 0%, transparent 60%),
      radial-gradient(ellipse 60% 50% at 85% 75%, rgba(245,158,11,0.12) 0%, transparent 55%),
      radial-gradient(ellipse 50% 40% at 50% 50%, rgba(249,115,22,0.07) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  /* ── FLOATING ORBS ── */
  .orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(70px);
    pointer-events: none;
    z-index: 0;
    animation: float 8s ease-in-out infinite;
  }
  .orb1 { width: 300px; height: 300px; background: rgba(99,102,241,0.15); top: -80px; left: -80px; animation-delay: 0s; }
  .orb2 { width: 200px; height: 200px; background: rgba(245,158,11,0.12); bottom: 60px; right: -40px; animation-delay: 3s; }
  .orb3 { width: 150px; height: 150px; background: rgba(249,115,22,0.10); top: 50%; left: 70%; animation-delay: 5s; }

  @keyframes float {
    0%,100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-24px) scale(1.04); }
  }

  /* ── HEADER ── */
  header {
    position: relative;
    z-index: 10;
    background: rgba(15,15,26,0.8);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
    padding: 16px 32px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .logo {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    font-weight: 800;
    color: var(--accent);
    letter-spacing: -0.5px;
    text-decoration: none;
  }
  .logo span { color: var(--purple2); }

  header nav ul { list-style: none; display: flex; gap: 6px; }
  header nav a {
    text-decoration: none;
    color: var(--muted);
    font-size: 14px;
    font-weight: 500;
    padding: 7px 16px;
    border-radius: 999px;
    border: 1px solid transparent;
    transition: var(--transition);
  }
  header nav a:hover {
    color: var(--text);
    border-color: var(--border);
    background: rgba(255,255,255,0.05);
  }
  header nav a.active {
    color: var(--accent);
    border-color: rgba(245,158,11,0.3);
    background: rgba(245,158,11,0.08);
  }

  /* ── MAIN ── */
  main {
    position: relative;
    z-index: 1;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }

  /* ── CARD ── */
  .card {
    width: 100%;
    max-width: 440px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 44px 40px 40px;
    backdrop-filter: blur(24px);
    animation: slideUp 0.6s cubic-bezier(0.4,0,0.2,1) both;
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ── BADGE ── */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(245,158,11,0.10);
    border: 1px solid rgba(245,158,11,0.25);
    border-radius: 999px;
    padding: 5px 14px;
    font-size: 12px;
    font-weight: 600;
    color: var(--accent);
    margin-bottom: 20px;
    letter-spacing: 0.3px;
  }
  .badge::before {
    content: '';
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--accent);
    display: inline-block;
  }

  .card h2 {
    font-family: 'Playfair Display', serif;
    font-size: 30px;
    font-weight: 800;
    color: var(--text);
    line-height: 1.2;
    margin-bottom: 6px;
  }

  .card .subtitle {
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 32px;
  }

  /* ── FORM ── */
  .field {
    margin-bottom: 18px;
  }

  label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 8px;
  }

  .input-wrap {
    position: relative;
  }

  .input-icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 16px;
    pointer-events: none;
    opacity: 0.5;
  }

  input[type="email"],
  input[type="password"],
  input[type="text"] {
    width: 100%;
    padding: 13px 14px 13px 42px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 12px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    outline: none;
    transition: var(--transition);
  }

  input::placeholder { color: rgba(148,163,184,0.5); }

  input:focus {
    border-color: rgba(245,158,11,0.5);
    background: rgba(245,158,11,0.06);
    box-shadow: 0 0 0 3px rgba(245,158,11,0.10);
  }

  /* ── FORGOT PASSWORD ── */
  .forgot-row {
    display: flex;
    justify-content: flex-end;
    margin-top: -10px;
    margin-bottom: 4px;
  }
  .forgot-row a {
    font-size: 12px;
    color: var(--muted);
    text-decoration: none;
    transition: var(--transition);
  }
  .forgot-row a:hover { color: var(--accent); }

  /* ── DIVIDER ── */
  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 24px 0;
  }
  .divider hr { flex: 1; border: none; border-top: 1px solid var(--border); }
  .divider span { font-size: 12px; color: var(--muted); white-space: nowrap; }

  /* ── SUBMIT BTN ── */
  .btn-submit {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
    color: #1a1a2e;
    border: none;
    border-radius: 12px;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: var(--transition);
    margin-top: 4px;
    position: relative;
    overflow: hidden;
  }

  .btn-submit::after {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(255,255,255,0);
    transition: background 0.2s;
  }

  .btn-submit:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 28px rgba(245,158,11,0.35);
  }
  .btn-submit:hover::after { background: rgba(255,255,255,0.08); }
  .btn-submit:active { transform: translateY(0); }

  /* ── LOADING STATE ── */
  .btn-submit.loading {
    pointer-events: none;
    opacity: 0.7;
  }
  .btn-submit.loading::before {
    content: '';
    display: inline-block;
    width: 14px; height: 14px;
    border: 2px solid rgba(26,26,46,0.4);
    border-top-color: #1a1a2e;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin-right: 8px;
    vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── SOCIAL BTNS ── */
  .social-row { display: flex; gap: 10px; }
  .btn-social {
    flex: 1;
    padding: 11px 10px;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: var(--transition);
    margin-top: 0;
  }
  .btn-social:hover {
    background: rgba(255,255,255,0.09);
    border-color: rgba(255,255,255,0.2);
    transform: translateY(-1px);
  }

  /* ── FOOTER TEXT ── */
  .card-footer {
    margin-top: 24px;
    text-align: center;
    font-size: 13px;
    color: var(--muted);
  }
  .card-footer a {
    color: var(--accent);
    text-decoration: none;
    font-weight: 600;
  }
  .card-footer a:hover { text-decoration: underline; }

  /* ── TOAST ── */
  .toast {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: #1e293b;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 22px;
    font-size: 14px;
    color: var(--text);
    z-index: 999;
    backdrop-filter: blur(10px);
    transition: transform 0.4s cubic-bezier(0.4,0,0.2,1);
    white-space: nowrap;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.success { border-color: rgba(34,197,94,0.4); color: #86efac; }
  .toast.error { border-color: rgba(239,68,68,0.4); color: #fca5a5; }

  /* ── FOOTER ── */
  footer {
    position: relative;
    z-index: 10;
    text-align: center;
    padding: 18px;
    font-size: 12px;
    color: var(--muted);
    border-top: 1px solid var(--border);
    background: rgba(15,15,26,0.6);
    backdrop-filter: blur(10px);
  }
  footer strong { color: var(--accent); }
</style>
</head>
<body>
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>

  <header>
    <a href="index.html" class="logo">Big <span>Mart</span></a>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="login.html" class="active">Login</a></li>
        <li><a href="cart.html">Cart</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <div class="card">
      <div class="badge">Welcome Back</div>
      <h2>Sign In</h2>
      <p class="subtitle">Good to see you again. Let's pick up where you left off.</p>

      <div class="social-row">
        <button class="btn-social" type="button">
          <svg width="16" height="16" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
          Google
        </button>
        <button class="btn-social" type="button">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="#1877F2"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
          Facebook
        </button>
      </div>

      <div class="divider"><hr/><span>or sign in with email</span><hr/></div>

      <div class="field">
        <label for="login-email">Email Address</label>
        <div class="input-wrap">
          <span class="input-icon">✉️</span>
          <input type="email" id="login-email" placeholder="you@example.com" autocomplete="email"/>
        </div>
      </div>

      <div class="field">
        <label for="login-password">Password</label>
        <div class="input-wrap">
          <span class="input-icon">🔒</span>
          <input type="password" id="login-password" placeholder="Your password" autocomplete="current-password"/>
        </div>
        <div class="forgot-row">
          <a href="#">Forgot password?</a>
        </div>
      </div>

      <button class="btn-submit" id="loginBtn" onclick="login()">Sign In →</button>

      <div class="card-footer">
        Don't have an account? <a href="signup.html">Create one</a>
      </div>
    </div>
  </main>

  <footer><strong>Big Mart</strong> &copy; 2026 — All rights reserved.</footer>

  <div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAE0B0njW7sckjrssICj6n6FcO97aZK0XY",
  authDomain: "big-mart-b9c81.firebaseapp.com",
  projectId: "big-mart-b9c81",
  storageBucket: "big-mart-b9c81.firebasestorage.app",
  messagingSenderId: "877079383192",
  appId: "1:877079383192:web:043068727a63f3d35d94ed",
  measurementId: "G-KBCXPSWB3Q"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

function showToast(msg, type = 'success') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast ${type} show`;
  setTimeout(() => t.classList.remove('show'), 3500);
}

window.login = async function() {
  const email = document.getElementById("login-email").value.trim();
  const password = document.getElementById("login-password").value;
  const btn = document.getElementById("loginBtn");

  if (!email || !password) {
    showToast("⚠️ Please fill in all fields.", "error");
    return;
  }

  btn.classList.add("loading");
  btn.textContent = "Signing in...";

  try {
    const userCredential = await signInWithEmailAndPassword(auth, email, password);
    showToast("✅ Welcome back, " + userCredential.user.email + "!", "success");
    setTimeout(() => window.location.href = "index.html", 1800);
  } catch (error) {
    btn.classList.remove("loading");
    btn.textContent = "Sign In →";
    const msgs = {
      'auth/user-not-found': '⚠️ No account found with this email.',
      'auth/wrong-password': '⚠️ Incorrect password. Try again.',
      'auth/invalid-email': '⚠️ Please enter a valid email.',
      'auth/invalid-credential': '⚠️ Invalid email or password.',
      'auth/too-many-requests': '⚠️ Too many attempts. Please try later.'
    };
    showToast(msgs[error.code] || "❌ " + error.message, "error");
  }
};
</script>
</body>
</html>
